version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    environment:
      - PORT=5000
    restart: always

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
        - VITE_API_URL=${VITE_API_URL}
    ports:
      - "3000:80"
    env_file:
      - ./Frontend/.env
    depends_on:
      - backend
    restart: always

  admin:
    build:
      context: ./Admin
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
        - VITE_API_URL=${VITE_API_URL}
    ports:
      - "3001:80"
    env_file:
      - ./Admin/.env
    depends_on:
      - backend
    restart: always